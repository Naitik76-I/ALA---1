<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Secure Message</title>

<style>

@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap');

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

:root{
    --bg:#020617;
    --border:rgba(148,163,184,.16);

    --blue:#38bdf8;
    --cyan:#22d3ee;
    --purple:#8b5cf6;
    --green:#34d399;
    --red:#fb7185;

    --text:#f8fafc;
    --muted:#94a3b8;
}

html{
    scroll-behavior:smooth;
}

body{
    min-height:100vh;
    overflow-x:hidden;

    color:var(--text);

    font-family:"Inter",sans-serif;

    background:
        radial-gradient(
            circle at 50% -20%,
            #172554 0%,
            #020617 55%
        );
}


/* =====================================================
   BACKGROUND
===================================================== */

.background{
    position:fixed;
    inset:0;
    overflow:hidden;
    pointer-events:none;
    z-index:-10;
}

.grid{
    position:absolute;
    inset:-100px;

    background-image:
        linear-gradient(
            rgba(56,189,248,.06) 1px,
            transparent 1px
        ),
        linear-gradient(
            90deg,
            rgba(56,189,248,.06) 1px,
            transparent 1px
        );

    background-size:50px 50px;

    transform:
        perspective(500px)
        rotateX(55deg)
        scale(1.7);

    transform-origin:center bottom;

    animation:gridMove 12s linear infinite;
}

@keyframes gridMove{

    from{
        background-position:0 0,0 0;
    }

    to{
        background-position:0 50px,50px 0;
    }

}


/* Glow Orbs */

.orb{
    position:absolute;

    border-radius:50%;

    filter:blur(100px);

    opacity:.25;

    animation:orbFloat 10s ease-in-out infinite;
}

.orb1{
    width:400px;
    height:400px;

    background:#2563eb;

    top:-180px;
    left:-120px;
}

.orb2{
    width:350px;
    height:350px;

    background:#7c3aed;

    right:-100px;
    top:30%;

    animation-delay:-3s;
}

.orb3{
    width:300px;
    height:300px;

    background:#0891b2;

    left:30%;
    bottom:-180px;

    animation-delay:-6s;
}

@keyframes orbFloat{

    0%,100%{
        transform:translate(0,0) scale(1);
    }

    50%{
        transform:translate(50px,-40px) scale(1.15);
    }

}


/* =====================================================
   PARTICLES
===================================================== */

.particles{
    position:absolute;
    inset:0;
}

.particle{
    position:absolute;

    width:3px;
    height:3px;

    border-radius:50%;

    background:#67e8f9;

    box-shadow:
        0 0 10px #22d3ee,
        0 0 20px #22d3ee;

    animation:particleFloat linear infinite;
}

@keyframes particleFloat{

    0%{
        transform:translateY(110vh) translateX(0);
        opacity:0;
    }

    10%{
        opacity:1;
    }

    90%{
        opacity:1;
    }

    100%{
        transform:translateY(-20vh) translateX(100px);
        opacity:0;
    }

}


/* =====================================================
   SCAN LINE
===================================================== */

.scanline{
    position:fixed;

    left:0;

    width:100%;

    height:2px;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(56,189,248,.5),
            transparent
        );

    box-shadow:
        0 0 20px rgba(56,189,248,.5);

    opacity:.3;

    animation:scan 7s linear infinite;

    pointer-events:none;

    z-index:100;
}

@keyframes scan{

    from{
        top:-5%;
    }

    to{
        top:105%;
    }

}


/* =====================================================
   CONTAINER
===================================================== */

.container{
    width:min(1050px,calc(100% - 30px));

    margin:auto;

    padding:55px 0 40px;
}


/* =====================================================
   HEADER
===================================================== */

.header{
    text-align:center;

    margin-bottom:40px;

    animation:
        headerEnter
        1s
        cubic-bezier(.2,.8,.2,1);
}

@keyframes headerEnter{

    from{
        opacity:0;

        transform:
            translateY(-40px)
            scale(.96);
    }

    to{
        opacity:1;

        transform:
            translateY(0)
            scale(1);
    }

}


/* Lock */

.lock{
    position:relative;

    width:90px;
    height:90px;

    margin:auto;

    margin-bottom:22px;

    display:flex;

    align-items:center;

    justify-content:center;

    border-radius:28px;

    font-size:40px;

    background:
        linear-gradient(
            135deg,
            rgba(56,189,248,.15),
            rgba(139,92,246,.18)
        );

    border:
        1px solid
        rgba(56,189,248,.25);

    box-shadow:
        0 0 30px rgba(56,189,248,.15);

    animation:
        lockFloat
        3s
        ease-in-out
        infinite;
}

.lock::before,
.lock::after{

    content:"";

    position:absolute;

    inset:-8px;

    border-radius:32px;

    border:
        1px solid
        rgba(56,189,248,.18);

    animation:
        lockRing
        2.5s
        linear
        infinite;
}

.lock::after{

    inset:-18px;

    border-color:
        rgba(139,92,246,.1);

    animation-delay:-1.2s;
}

@keyframes lockFloat{

    0%,100%{
        transform:
            translateY(0)
            rotate(0);
    }

    50%{
        transform:
            translateY(-10px)
            rotate(2deg);
    }

}

@keyframes lockRing{

    from{
        transform:
            rotate(0deg)
            scale(.9);

        opacity:1;
    }

    to{
        transform:
            rotate(360deg)
            scale(1.1);

        opacity:0;
    }

}


/* Header */

.header h1{

    font-size:
        clamp(
            38px,
            7vw,
            62px
        );

    line-height:1;

    letter-spacing:-3px;

    font-weight:800;
}

.gradient{

    background:
        linear-gradient(
            90deg,
            #38bdf8,
            #818cf8,
            #c084fc,
            #38bdf8
        );

    background-size:300%;

    -webkit-background-clip:text;

    background-clip:text;

    color:transparent;

    animation:
        gradientMove
        4s
        ease
        infinite;
}

@keyframes gradientMove{

    0%{
        background-position:0%;
    }

    50%{
        background-position:100%;
    }

    100%{
        background-position:0%;
    }

}


/* Status */

.status-pill{

    display:inline-flex;

    align-items:center;

    gap:8px;

    margin-top:20px;

    padding:
        9px
        15px;

    border-radius:999px;

    color:#a7f3d0;

    background:
        rgba(16,185,129,.07);

    border:
        1px solid
        rgba(52,211,153,.18);

    font-size:11px;
}

.live-dot{

    width:7px;
    height:7px;

    border-radius:50%;

    background:#34d399;

    box-shadow:
        0 0 10px #34d399;

    animation:
        livePulse
        1.5s
        infinite;
}

@keyframes livePulse{

    50%{
        transform:scale(.4);
        opacity:.4;
    }

}


/* =====================================================
   MAIN CARD
===================================================== */

.card{

    position:relative;

    padding:30px;

    border-radius:28px;

    background:
        linear-gradient(
            145deg,
            rgba(15,23,42,.82),
            rgba(2,6,23,.75)
        );

    border:
        1px solid
        var(--border);

    backdrop-filter:blur(25px);

    box-shadow:
        0 35px 100px rgba(0,0,0,.45);

    overflow:hidden;

    animation:
        cardEnter
        1s
        .2s
        both;
}

@keyframes cardEnter{

    from{
        opacity:0;

        transform:
            translateY(50px)
            scale(.96);
    }

    to{
        opacity:1;

        transform:
            translateY(0)
            scale(1);
    }

}

.card::before{

    content:"";

    position:absolute;

    top:0;

    left:-100%;

    width:60%;

    height:1px;

    background:
        linear-gradient(
            90deg,
            transparent,
            #38bdf8,
            transparent
        );

    box-shadow:
        0 0 20px #38bdf8;

    animation:
        cardScan
        5s
        linear
        infinite;
}

@keyframes cardScan{

    0%{
        left:-60%;
    }

    100%{
        left:120%;
    }

}


/* =====================================================
   SECTIONS
===================================================== */

.section{
    margin-bottom:26px;
}

.section-head{

    display:flex;

    align-items:center;

    gap:13px;

    margin-bottom:20px;
}

.number{

    width:40px;
    height:40px;

    display:flex;

    align-items:center;

    justify-content:center;

    border-radius:13px;

    background:
        linear-gradient(
            135deg,
            #2563eb,
            #7c3aed
        );

    font-size:12px;

    font-weight:800;

    box-shadow:
        0 10px 30px
        rgba(37,99,235,.2);

    animation:
        numberPulse
        3s
        infinite;
}

@keyframes numberPulse{

    0%,100%{

        box-shadow:
            0 10px 30px
            rgba(37,99,235,.2);
    }

    50%{

        box-shadow:
            0 0 35px
            rgba(124,58,237,.45);
    }

}

.section-head h2{
    font-size:18px;
}

.section-head p{

    margin-top:3px;

    color:#64748b;

    font-size:11px;
}


/* =====================================================
   FIELDS
===================================================== */

.field{
    margin-bottom:21px;
}

.label{

    display:flex;

    justify-content:space-between;

    margin-bottom:9px;
}

.label span:first-child{

    color:#cbd5e1;

    font-size:12px;

    font-weight:600;
}

.label span:last-child{

    color:#475569;

    font-size:10px;
}


textarea,
input{

    width:100%;

    border:
        1px solid
        rgba(148,163,184,.15);

    background:
        rgba(2,6,23,.72);

    color:white;

    outline:none;

    transition:
        border .3s,
        box-shadow .3s,
        transform .3s;
}

textarea{

    min-height:130px;

    padding:16px;

    resize:vertical;

    border-radius:14px;

    line-height:1.6;

    font-size:13px;
}

input{

    height:50px;

    padding:
        0 15px;

    border-radius:13px;

    font-size:12px;
}

textarea::placeholder,
input::placeholder{

    color:#475569;
}

textarea:focus,
input:focus{

    border-color:
        rgba(56,189,248,.6);

    box-shadow:
        0 0 0 4px
        rgba(56,189,248,.06),

        0 0 30px
        rgba(56,189,248,.1);

    transform:
        translateY(-2px);
}


/* =====================================================
   KEY
===================================================== */

.key-container{
    position:relative;
}

.key-container input{

    padding-right:105px;

    font-family:
        "Space Mono",
        monospace;

    color:#67e8f9;
}

.generate{

    position:absolute;

    right:6px;

    top:6px;

    height:38px;

    padding:
        0 13px;

    border:
        1px solid
        rgba(56,189,248,.2);

    border-radius:9px;

    background:
        rgba(56,189,248,.08);

    color:#67e8f9;

    cursor:pointer;

    font-size:10px;

    font-weight:700;

    transition:.25s;
}

.generate:hover{

    background:
        rgba(56,189,248,.18);

    box-shadow:
        0 0 20px
        rgba(56,189,248,.15);
}


/* =====================================================
   CIPHER
===================================================== */

#cipherText{

    min-height:150px;

    font-family:
        "Space Mono",
        monospace;

    font-size:10px;

    color:#a5b4fc;

    background:
        linear-gradient(
            90deg,
            rgba(15,23,42,.8),
            rgba(30,27,75,.35),
            rgba(15,23,42,.8)
        );

    background-size:200% 100%;

    animation:
        cipherGlow
        5s
        ease-in-out
        infinite;
}

@keyframes cipherGlow{

    0%,100%{
        background-position:0%;
    }

    50%{
        background-position:100%;
    }

}


/* =====================================================
   BUTTONS
===================================================== */

.actions{

    display:grid;

    grid-template-columns:
        1fr 1fr;

    gap:14px;

    margin:27px 0;
}

.action{

    position:relative;

    height:58px;

    border:0;

    border-radius:14px;

    color:white;

    font-size:13px;

    font-weight:700;

    cursor:pointer;

    overflow:hidden;

    transition:
        transform .25s,
        box-shadow .25s;
}

.action::before{

    content:"";

    position:absolute;

    top:0;

    left:-120%;

    width:80%;

    height:100%;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(255,255,255,.2),
            transparent
        );

    transform:
        skewX(-20deg);

    transition:.6s;
}

.action:hover::before{
    left:140%;
}

.action:hover{

    transform:
        translateY(-4px)
        scale(1.01);
}

.encrypt{

    background:
        linear-gradient(
            135deg,
            #2563eb,
            #4f46e5,
            #7c3aed
        );

    box-shadow:
        0 12px 40px
        rgba(79,70,229,.3);
}

.decrypt{

    background:
        linear-gradient(
            135deg,
            #059669,
            #0d9488,
            #0891b2
        );

    box-shadow:
        0 12px 40px
        rgba(5,150,105,.25);
}

.action.loading{

    animation:
        processing
        .8s
        ease
        infinite;
}

@keyframes processing{

    50%{

        transform:
            scale(.98);

        filter:
            brightness(1.25);
    }

}


/* =====================================================
   DIVIDER
===================================================== */

.divider{

    display:flex;

    align-items:center;

    gap:14px;

    margin:36px 0;

    color:#475569;

    font-family:
        "Space Mono",
        monospace;

    font-size:9px;
}

.divider::before,
.divider::after{

    content:"";

    height:1px;

    flex:1;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(148,163,184,.15)
        );
}

.divider::after{

    background:
        linear-gradient(
            90deg,
            rgba(148,163,184,.15),
            transparent
        );
}


/* =====================================================
   DECRYPTED OUTPUT
===================================================== */

#decryptedText{

    border-color:
        rgba(52,211,153,.15);

    background:
        rgba(6,78,59,.08);

    transition:.3s;
}

#decryptedText.success-animation{

    animation:
        decryptedPulse
        .8s
        ease;
}

@keyframes decryptedPulse{

    0%{

        box-shadow:
            0 0 0
            rgba(52,211,153,0);
    }

    50%{

        box-shadow:
            0 0 35px
            rgba(52,211,153,.3);
    }

    100%{

        box-shadow:
            0 0 0
            rgba(52,211,153,0);
    }

}


/* =====================================================
   STATUS
===================================================== */

.status{

    display:none;

    padding:
        13px 15px;

    border-radius:12px;

    font-size:11px;

    animation:
        statusIn
        .35s
        ease;
}

.status.success{

    display:block;

    color:#a7f3d0;

    background:
        rgba(16,185,129,.07);

    border:
        1px solid
        rgba(52,211,153,.18);

    box-shadow:
        0 0 25px
        rgba(52,211,153,.06);
}

.status.error{

    display:block;

    color:#fecaca;

    background:
        rgba(244,63,94,.07);

    border:
        1px solid
        rgba(251,113,133,.18);

    animation:
        shake
        .4s
        ease;
}

@keyframes statusIn{

    from{

        opacity:0;

        transform:
            translateY(-8px);
    }

    to{

        opacity:1;

        transform:
            translateY(0);
    }

}

@keyframes shake{

    0%,100%{
        transform:translateX(0);
    }

    25%{
        transform:translateX(-7px);
    }

    75%{
        transform:translateX(7px);
    }

}


/* =====================================================
   CLEAR BUTTON
===================================================== */

.clear-container{

    margin-top:28px;

    display:flex;

    justify-content:center;
}

.clear-button{

    position:relative;

    min-width:180px;

    height:50px;

    padding:0 24px;

    border-radius:13px;

    border:
        1px solid
        rgba(251,113,133,.25);

    background:
        rgba(244,63,94,.07);

    color:#fda4af;

    font-family:"Inter",sans-serif;

    font-size:12px;

    font-weight:700;

    cursor:pointer;

    overflow:hidden;

    transition:
        .3s;
}

.clear-button::before{

    content:"";

    position:absolute;

    left:-100%;

    top:0;

    width:70%;

    height:100%;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(255,255,255,.15),
            transparent
        );

    transform:
        skewX(-20deg);

    transition:.6s;
}

.clear-button:hover::before{

    left:130%;
}

.clear-button:hover{

    color:white;

    background:
        rgba(244,63,94,.15);

    border-color:
        rgba(251,113,133,.5);

    box-shadow:
        0 0 30px
        rgba(244,63,94,.15);

    transform:
        translateY(-3px);
}

.clear-button:active{

    transform:
        scale(.96);
}


/* Clear animation */

.clear-button.clearing{

    animation:
        clearPulse
        .5s
        ease;
}

@keyframes clearPulse{

    50%{

        transform:
            scale(.94);

        filter:
            brightness(1.4);
    }

}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:700px){

    .container{

        width:
            calc(100% - 18px);

        padding-top:30px;
    }

    .card{

        padding:19px;

        border-radius:22px;
    }

    .actions{

        grid-template-columns:1fr;
    }

    .header h1{

        letter-spacing:-2px;
    }

}

</style>
</head>


<body>


<!-- =====================================================
     BACKGROUND
===================================================== -->

<div class="background">

    <div class="grid"></div>

    <div class="orb orb1"></div>

    <div class="orb orb2"></div>

    <div class="orb orb3"></div>

    <div
        class="particles"
        id="particles"
    ></div>

</div>


<div class="scanline"></div>



<!-- =====================================================
     MAIN
===================================================== -->

<main class="container">


    <!-- HEADER -->

    <header class="header">

        <div class="lock">
            🔐
        </div>

        <h1>

            <span class="gradient">
                Secure Message
            </span>

        </h1>


        <div class="status-pill">

            <span class="live-dot"></span>

            Client-Side Encryption Active

        </div>

    </header>



    <!-- =================================================
         MAIN CARD
    ================================================= -->

    <section class="card">


        <!-- =================================================
             ENCRYPTION
        ================================================= -->

        <div class="section">


            <div class="section-head">

                <div class="number">
                    01
                </div>

                <div>

                    <h2>
                        Encryption
                    </h2>

                    <p>
                        Transform plain text into secure cipher text
                    </p>

                </div>

            </div>



            <!-- Plain Text -->

            <div class="field">

                <div class="label">

                    <span>
                        Plain Text
                    </span>

                    <span>
                        INPUT
                    </span>

                </div>


                <textarea
                    id="plainText"
                    placeholder="Type your secret message..."
                ></textarea>

            </div>



            <!-- Symmetric Key -->

            <div class="field">

                <div class="label">

                    <span>
                        Symmetric Key
                    </span>

                    <span>
                        AES-256
                    </span>

                </div>


                <div class="key-container">

                    <input
                        id="encryptionKey"
                        type="text"
                        readonly
                        placeholder="Secure key will be generated..."
                    >


                    <button
                        class="generate"
                        onclick="generateKey()"
                    >
                        GENERATE
                    </button>

                </div>

            </div>



            <!-- Cipher Text -->

            <div class="field">

                <div class="label">

                    <span>
                        Cipher Text
                    </span>

                    <span>
                        ENCRYPTED
                    </span>

                </div>


                <textarea
    id="cipherText"
    placeholder="Encrypted data will appear here..."
    readonly
></textarea>
            </div>



            <!-- Encryption Buttons -->

            <div class="actions">


                <button
                    class="action encrypt"
                    id="encryptButton"
                    onclick="encryptMessage()"
                >

                    🔐

                    <span id="encryptText">
                        Encrypt Message
                    </span>

                </button>



                <button
                    class="action decrypt"
                    id="decryptButton"
                    onclick="decryptMessage()"
                >

                    🔓

                    <span id="decryptText">
                        Decrypt Message
                    </span>

                </button>


            </div>



            <!-- Status -->

            <div
                id="status"
                class="status"
            ></div>


        </div>



        <!-- Divider -->

        <div class="divider">

            SECURE DECRYPTION CHANNEL

        </div>



        <!-- =================================================
             DECRYPTION
        ================================================= -->

        <div class="section">


            <div class="section-head">

                <div class="number">
                    02
                </div>

                <div>

                    <h2>
                        Decryption
                    </h2>

                    <p>
                        Recover your original message
                    </p>

                </div>

            </div>



            <!-- Symmetric Key -->

            <div class="field">

                <div class="label">

                    <span>
                        Symmetric Key
                    </span>

                    <span>
                        AES-256
                    </span>

                </div>


                <input
                    id="decryptionKey"
                    type="text"
                    placeholder="Paste your AES symmetric key..."
                >

            </div>



            <!-- Plain Text -->

            <div class="field">

                <div class="label">

                    <span>
                        Plain Text
                    </span>

                    <span>
                        DECRYPTED
                    </span>

                </div>


                <textarea
                    id="decryptedText"
                    readonly
                    placeholder="Decrypted message will appear here..."
                ></textarea>

            </div>


        </div>


        <!-- =================================================
             CLEAR BUTTON
        ================================================= -->

        <div class="clear-container">

            <button
                class="clear-button"
                id="clearButton"
                onclick="clearAll()"
            >

                🗑️ &nbsp; Clear All

            </button>

        </div>


    </section>


</main>



<script>


/* =====================================================
   PARTICLES
===================================================== */

const particles =
    document.getElementById(
        "particles"
    );


for(
    let i = 0;
    i < 55;
    i++
){

    const particle =
        document.createElement(
            "span"
        );


    particle.className =
        "particle";


    particle.style.left =
        Math.random() * 100 + "%";


    particle.style.animationDuration =
        (6 + Math.random() * 12)
        + "s";


    particle.style.animationDelay =
        -(Math.random() * 12)
        + "s";


    particle.style.opacity =
        Math.random();


    particles.appendChild(
        particle
    );

}


/* =====================================================
   AES VARIABLES
===================================================== */

let currentAESKey = null;

let currentIV = null;


/* =====================================================
   GENERATE AES KEY
===================================================== */

async function generateKey(){

    const button =
        document.querySelector(
            ".generate"
        );


    button.textContent =
        "GENERATING...";


    button.style.transform =
        "rotateX(360deg)";


    try{

        currentAESKey =
            await crypto.subtle.generateKey(

                {
                    name:"AES-GCM",

                    length:256
                },

                true,

                [
                    "encrypt",
                    "decrypt"
                ]

            );


        const rawKey =
            await crypto.subtle.exportKey(
                "raw",
                currentAESKey
            );


        const key =
            arrayBufferToBase64(
                rawKey
            );


        document.getElementById(
            "encryptionKey"
        ).value =
            key;


        document.getElementById(
            "decryptionKey"
        ).value =
            key;


        showStatus(
            "✓ AES-256 key generated successfully.",
            "success"
        );

    }

    catch(error){

        console.error(error);

        showStatus(
            "Key generation failed.",
            "error"
        );

    }


    setTimeout(()=>{

        button.textContent =
            "GENERATE";

        button.style.transform =
            "";

    },600);

}


/* =====================================================
   ENCRYPT
===================================================== */

async function encryptMessage(){

    const button =
        document.getElementById(
            "encryptButton"
        );


    const buttonText =
        document.getElementById(
            "encryptText"
        );


    const plainText =
        document.getElementById(
            "plainText"
        ).value;


    if(!plainText.trim()){

        showStatus(
            "Please enter a message first.",
            "error"
        );

        return;

    }


    button.classList.add(
        "loading"
    );


    buttonText.textContent =
        "Encrypting...";


    try{

        if(!currentAESKey){

            await generateKey();

        }


        currentIV =
            crypto.getRandomValues(
                new Uint8Array(12)
            );


        const encoded =
            new TextEncoder().encode(
                plainText
            );


        const encrypted =
            await crypto.subtle.encrypt(

                {
                    name:"AES-GCM",

                    iv:currentIV
                },

                currentAESKey,

                encoded

            );


        const packageData = {

            algorithm:
                "AES-256-GCM",

            iv:
                arrayBufferToBase64(
                    currentIV
                ),

            cipherText:
                arrayBufferToBase64(
                    encrypted
                )

        };


        document.getElementById(
            "cipherText"
        ).value =
            JSON.stringify(
                packageData
            );


        showStatus(
            "✓ Encryption completed successfully.",
            "success"
        );

    }

    catch(error){

        console.error(error);

        showStatus(
            "Encryption failed.",
            "error"
        );

    }


    setTimeout(()=>{

        button.classList.remove(
            "loading"
        );

        buttonText.textContent =
            "Encrypt Message";

    },700);

}


/* =====================================================
   DECRYPT
===================================================== */

async function decryptMessage(){

    const button =
        document.getElementById(
            "decryptButton"
        );


    const buttonText =
        document.getElementById(
            "decryptText"
        );


    const cipherText =
        document.getElementById(
            "cipherText"
        ).value.trim();


    const key =
        document.getElementById(
            "decryptionKey"
        ).value.trim();


    if(!cipherText){

        showStatus(
            "Please enter cipher text.",
            "error"
        );

        return;

    }


    if(!key){

        showStatus(
            "Please enter the symmetric key.",
            "error"
        );

        return;

    }


    button.classList.add(
        "loading"
    );


    buttonText.textContent =
        "Decrypting...";


    try{

        const packageData =
            JSON.parse(
                cipherText
            );


        const rawKey =
            base64ToArrayBuffer(
                key
            );


        const aesKey =
            await crypto.subtle.importKey(

                "raw",

                rawKey,

                {
                    name:"AES-GCM"
                },

                false,

                [
                    "decrypt"
                ]

            );


        const iv =
            new Uint8Array(

                base64ToArrayBuffer(
                    packageData.iv
                )

            );


        const encrypted =
            base64ToArrayBuffer(
                packageData.cipherText
            );


        const decrypted =
            await crypto.subtle.decrypt(

                {
                    name:"AES-GCM",

                    iv:iv
                },

                aesKey,

                encrypted

            );


        const message =
            new TextDecoder().decode(
                decrypted
            );


        const output =
            document.getElementById(
                "decryptedText"
            );


        output.value =
            message;


        output.classList.remove(
            "success-animation"
        );


        void output.offsetWidth;


        output.classList.add(
            "success-animation"
        );


        showStatus(
            "✓ Decryption completed successfully.",
            "success"
        );

    }

    catch(error){

        console.error(error);

        showStatus(
            "✕ Decryption failed. Invalid key or cipher text.",
            "error"
        );

    }


    setTimeout(()=>{

        button.classList.remove(
            "loading"
        );

        buttonText.textContent =
            "Decrypt Message";

    },700);

}


/* =====================================================
   CLEAR ALL
===================================================== */

function clearAll(){

    const button =
        document.getElementById(
            "clearButton"
        );


    /*
        Add clear animation
    */

    button.classList.add(
        "clearing"
    );


    /*
        Clear all input fields
    */

    document.getElementById(
        "plainText"
    ).value = "";


    document.getElementById(
        "encryptionKey"
    ).value = "";


    document.getElementById(
        "cipherText"
    ).value = "";


    document.getElementById(
        "decryptionKey"
    ).value = "";


    document.getElementById(
        "decryptedText"
    ).value = "";


    /*
        Reset AES variables
    */

    currentAESKey = null;

    currentIV = null;


    /*
        Clear status
    */

    const status =
        document.getElementById(
            "status"
        );


    status.className =
        "status";


    status.textContent =
        "";


    /*
        Reset animations
    */

    document.getElementById(
        "decryptedText"
    ).classList.remove(
        "success-animation"
    );


    /*
        Button animation remove
    */

    setTimeout(()=>{

        button.classList.remove(
            "clearing"
        );

    },500);

}


/* =====================================================
   ARRAY BUFFER → BASE64
===================================================== */

function arrayBufferToBase64(
    buffer
){

    const bytes =
        new Uint8Array(
            buffer
        );


    let binary = "";


    for(
        let i = 0;
        i < bytes.length;
        i++
    ){

        binary +=
            String.fromCharCode(
                bytes[i]
            );

    }


    return btoa(
        binary
    );

}


/* =====================================================
   BASE64 → ARRAY BUFFER
===================================================== */

function base64ToArrayBuffer(
    base64
){

    const binary =
        atob(base64);


    const bytes =
        new Uint8Array(
            binary.length
        );


    for(
        let i = 0;
        i < binary.length;
        i++
    ){

        bytes[i] =
            binary.charCodeAt(i);

    }


    return bytes.buffer;

}


/* =====================================================
   STATUS
===================================================== */

function showStatus(
    message,
    type
){

    const status =
        document.getElementById(
            "status"
        );


    status.textContent =
        message;


    status.className =
        "status " + type;


    clearTimeout(
        window.statusTimeout
    );


    window.statusTimeout =
        setTimeout(()=>{

            status.className =
                "status";

        },4500);

}

</script>
